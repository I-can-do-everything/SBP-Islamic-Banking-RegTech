# GL to reporting code mapping used by the demo.
#
# Rules are matched against the bank's GL code with a FULL match (the whole code
# must fit the pattern), which fixes BUG-018. Rules are checked in order and the
# loader warns when one account fits more than one rule.
#
# The patterns cover the GL numbering of the fictional Example Islamic Bank
# (generated by daleel.datagen) and common T24 and Flexcube style layouts. Any
# account that matches nothing is reported as unmapped (FIX-022).
#
# kind:
#   direct      one GL account to one reporting code
#   apportion   one GL account split across codes by exact percentages that must
#               total 100 (FIX-019)

version: "exib-2026.1"
rules:
  - {pattern: '10\d{2}-\d{3}',  code: A.CASH}
  - {pattern: '11\d{2}-\d{3}',  code: A.SBP}
  - {pattern: '12\d{2}-\d{3}',  code: A.DUE_FI}
  - {pattern: '13[0-4]\d-\d{3}', code: A.INV_GOP}
  - {pattern: '13[5-9]\d-\d{3}', code: A.INV_OTHER}
  - {pattern: '140\d-\d{3}',    code: A.FIN_MUR}
  - {pattern: '141\d-\d{3}',    code: A.FIN_IJA}
  - {pattern: '142\d-\d{3}',    code: A.FIN_DM}
  - {pattern: '143\d-\d{3}',    code: A.FIN_MUSH}
  - {pattern: '144\d-\d{3}',    code: A.FIN_IST}
  - {pattern: '145\d-\d{3}',    code: A.FIN_SAL}
  - {pattern: '146\d-\d{3}',    code: A.FIN_TIJ}
  - {pattern: '147\d-\d{3}',    code: A.FIN_OTH}
  - {pattern: '149\d-\d{3}',    code: A.PROV}
  - {pattern: '15\d{2}-\d{3}',  code: A.FIXED}
  - {pattern: '16\d{2}-\d{3}',  code: A.INTANG}
  - {pattern: '17\d{2}-\d{3}',  code: A.OTHER}
  # Shared premises account: split between fixed assets and other assets.
  - {pattern: '1800-001', kind: apportion, split: {A.FIXED: "60.00", A.OTHER: "40.00"}}
  - {pattern: '20\d{2}-\d{3}',  code: L.DEP_CUR}
  - {pattern: '21\d{2}-\d{3}',  code: L.DEP_SAV}
  - {pattern: '22\d{2}-\d{3}',  code: L.DEP_TERM}
  - {pattern: '23\d{2}-\d{3}',  code: L.DUE_FI}
  - {pattern: '24\d{2}-\d{3}',  code: L.SUKUK_SUB}
  - {pattern: '250\d-\d{3}',    code: L.PER}
  - {pattern: '251\d-\d{3}',    code: L.IRR}
  - {pattern: '26\d{2}-\d{3}',  code: L.CHARITY}
  - {pattern: '27\d{2}-\d{3}',  code: L.OTHER}
  - {pattern: '30\d{2}-\d{3}',  code: E.PAIDUP}
  - {pattern: '31\d{2}-\d{3}',  code: E.STAT_RES}
  - {pattern: '32\d{2}-\d{3}',  code: E.OTHER_RES}
  - {pattern: '33\d{2}-\d{3}',  code: E.PER_RES}
  - {pattern: '34\d{2}-\d{3}',  code: E.UNAPPROP}
  - {pattern: '40\d{2}-\d{3}',  code: I.FIN}
  - {pattern: '41\d{2}-\d{3}',  code: I.INV}
  - {pattern: '42\d{2}-\d{3}',  code: I.FEE}
  - {pattern: '43\d{2}-\d{3}',  code: I.CHARITY}
  - {pattern: '50\d{2}-\d{3}',  code: X.DEP}
  - {pattern: '51\d{2}-\d{3}',  code: X.OPEX}
  - {pattern: '52\d{2}-\d{3}',  code: X.PROV}
