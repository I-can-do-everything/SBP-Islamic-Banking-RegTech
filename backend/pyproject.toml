[project]
name = "daleel"
version = "0.1.0"
description = "Daleel: an Islamic bank regulatory compliance tool"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "pyyaml>=6.0",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "rapidfuzz>=3.10",
  "numpy>=2.1",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.115", "ruff>=0.7"]

[project.scripts]
daleel = "daleel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daleel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
